name: Verify selected CC0 audio originals

on:
  push:
    paths:
      - '.github/workflows/verify-cc0-audio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-source-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Locate each original and inspect real audio bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import html, json, re, urllib.request, urllib.parse, urllib.error, time
          from html.parser import HTMLParser

          choices = [
            ('First Light Particles','https://opengameart.org/content/first-light-particles-%E2%80%93-cc0-atmospheric-pianoambient-track','first_light_particles.wav'),
            ('Calm Piano 1','https://opengameart.org/content/calm-piano-1-vaporware','003_Vaporware.mp3'),
            ('Forget Me Not','https://opengameart.org/content/forget-me-not','forget_me_not_in_f_major.ogg'),
            ('Calm Ambient 3','https://opengameart.org/content/calm-ambient-3-lifewave-2k','006_lifeWave2k.mp3'),
            ('Rain on Window Loop','https://opengameart.org/content/rain-on-window-loop','rain_on_window_loop.wav'),
            ('Rain in the Gutter Loop','https://opengameart.org/content/rain-gutter-loop','rain-gutter-loop_0.mp3')
          ]
          class Links(HTMLParser):
            def __init__(self): super().__init__(); self.links=[]
            def handle_starttag(self,tag,attrs):
              if tag=='a':
                att=dict(attrs)
                if 'href' in att: self.links.append(att['href'])
          headers={'User-Agent':'DailyPause-Audio-Research/1.0 (license verification; one request per resource)'}
          results=[]
          for title,page,filename in choices:
            row={'title':title,'page':page,'filename':filename}
            try:
              req=urllib.request.Request(page,headers=headers)
              with urllib.request.urlopen(req,timeout=20) as r: data=r.read(4000000).decode('utf8','replace')
              row['cc0_visible']=('CC0' in data)
              parser=Links();parser.feed(data)
              matches=[urllib.parse.urljoin(page,html.unescape(l)) for l in parser.links if filename.lower() in urllib.parse.unquote(l).lower()]
              if not matches: raise RuntimeError('original file link not found in page')
              url=next((u for u in matches if urllib.parse.unquote(urllib.parse.urlsplit(u).path).lower().endswith(filename.lower())),matches[0])
              row['url']=url
              req=urllib.request.Request(url,headers={**headers,'Range':'bytes=0-127'})
              with urllib.request.urlopen(req,timeout=25) as r:
                data=r.read(128)
                row['status']=r.status
                row['mime']=r.headers.get('Content-Type')
                row['length']=r.headers.get('Content-Length')
                row['cors']=r.headers.get('Access-Control-Allow-Origin')
              row['audio_signature']=bool(data[:4] in (b'RIFF',b'OggS') or data[:3]==b'ID3' or (len(data)>1 and data[0]==255 and (data[1]&224)==224))
              row['ok']=bool(row['cc0_visible'] and row['audio_signature'])
            except Exception as e:
              row['ok']=False;row['error']=str(e)
            results.append(row)
            print(json.dumps(row,ensure_ascii=False),flush=True)
          import pathlib
          pathlib.Path('cc0-source-verify.json').write_text(json.dumps(results,ensure_ascii=False,indent=2))
          if not all(r['ok'] for r in results[:4]): raise SystemExit('Not all four approved sources can be accessed and verified')
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc0-source-verify
          path: cc0-source-verify.json
          retention-days: 30
