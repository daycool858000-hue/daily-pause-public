name: Draft Palette Garden Regression Tests

on:
  pull_request:
    paths:
      - 'garden*.js'
      - 'garden.css'
      - 'mood-*.js'
      - 'palette-world.js'
      - 'palette-history.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/feature-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local interactions and safeguards
        run: node --test tests/feature-basics.test.cjs
