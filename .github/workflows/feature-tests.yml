name: Draft Palette Garden Regression Tests

on:
  pull_request:
    paths:
      - 'garden*.js'
      - 'garden.css'
      - 'mood-*.js'
      - 'palette-world.js'
      - 'palette-history.js'
      - 'index.html'
      - 'tests/**'
      - '.github/workflows/feature-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check local interactions and safeguards
        run: node --test tests/feature-basics.test.cjs

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test-only browser tool
        run: npm install --no-save playwright@1.56.1
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Desktop Chromium and Mobile WebKit smoke test
        run: node tests/browser-smoke.cjs
