name: Publish October 2026 immutable archive ZIP

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-archive-20261013.yml'

permissions:
  contents: write

jobs:
  publish-archive-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the fixed, already validated archival snapshot
        uses: actions/checkout@v4
        with:
          ref: 2914dcf573fddb79d9a019599eb70f08b59419c0
          persist-credentials: false
      - name: Guard snapshot and validate archive metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2914dcf573fddb79d9a019599eb70f08b59419c0"
          test -f ARCHIVE_20261013.md
          test -f HANDOFF_20261013.md
          test -f media/audio/SOURCES.json
          node scripts/site-audit.mjs .
          node scripts/ui-runtime-smoke.mjs .
          node scripts/locker-audit.mjs .
      - name: Download independently packaged archive and create evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request, zipfile
          root=pathlib.Path('release-archive')
          root.mkdir(parents=True,exist_ok=True)
          name=root/'daily-pause-2026-10-13-full-source.zip'
          sha='2914dcf573fddb79d9a019599eb70f08b59419c0'
          url=f'https://codeload.github.com/daycool858000-hue/daily-pause-public/zip/{sha}'
          request=urllib.request.Request(url,headers={'User-Agent':'daily-pause-archive-preservation'})
          with urllib.request.urlopen(request,timeout=120) as response, name.open('wb') as output:
            while chunk:=response.read(1024*1024):
              output.write(chunk)
          assert zipfile.is_zipfile(name),'GitHub returned an invalid ZIP'
          with zipfile.ZipFile(name) as archive:
            corrupted=archive.testzip()
            assert corrupted is None,f'corrupted ZIP entry: {corrupted}'
            entries=archive.namelist()
            assert any(x.endswith('/ARCHIVE_20261013.md') for x in entries)
            assert any(x.endswith('/HANDOFF_20261013.md') for x in entries)
            assert any(x.endswith('/media/audio/SOURCES.json') for x in entries)
            assert any(x.endswith('/index.html') for x in entries)
            count=len([x for x in entries if not x.endswith('/')])
            assert count==85,f'Unexpected file count {count}, expected 85'
          digest=hashlib.sha256(name.read_bytes()).hexdigest()
          (root/(name.name+'.sha256')).write_text(f'{digest}  {name.name}\n',encoding='utf8')
          print('ZIP file count',count,'size',name.stat().st_size,'sha256',digest)
          PY
      - name: Publish fixed snapshot as GitHub Release with durable ZIP and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="daily-pause-2026-10-13-archive"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Archive Release already exists. Refusing to replace an immutable snapshot."
            exit 1
          fi
          cat > release-notes.md <<'NOTES'
          每日一息｜2026 年 10 月完整網站版本保存與交接。
          
          固定內容版本：2914dcf573fddb79d9a019599eb70f08b59419c0
          主要網站功能版：38b2a567c027e25dbcb2ed0b95d1650ab344b001
          
          ZIP 包含公開網站所有 HTML、CSS、JavaScript、圖片、目前保存的音訊、文章、80 張每日小卡、55 則每日提醒、15 種休息體驗、原創驚喜句子、來源查核文件、程式測試與備份還原手冊。
          
          原始 Manus 工程、12 張 AI 圖的原生成權利紀錄與訪客本機私密 localStorage **不在 ZIP 內**。完整的權利殘餘風險和寄物所實機驗收界線，請讀 ARCHIVE_20261013.md。
          
          檔案：daily-pause-2026-10-13-full-source.zip
          校驗碼：同名 ZIP 的 .sha256
          NOTES
          gh release create "$tag" \
            release-archive/daily-pause-2026-10-13-full-source.zip \
            release-archive/daily-pause-2026-10-13-full-source.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "2914dcf573fddb79d9a019599eb70f08b59419c0" \
            --title "每日一息｜2026-10-13 正式封存" \
            --notes-file release-notes.md \
            --latest=false
